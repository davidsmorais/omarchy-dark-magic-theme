# Dark Magic — mint accent with blue secondary, matching VSCode theme

$activeBorderColor = rgb(66eeaa) rgb(6bc7f5) 45deg
$inactiveBorderColor = rgb(424260)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_out = 8
    gaps_in = 4
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 8
    rounding_power = 2.0
}
